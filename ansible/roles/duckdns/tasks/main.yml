---
- name: Update DuckDNS record
  ansible.builtin.uri:
    url: "https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}&ip={{ ansible_host }}"
    method: GET
    return_content: true
  register: duckdns_update

- name: Show DuckDNS response
  ansible.builtin.debug:
    var: duckdns_update.content
